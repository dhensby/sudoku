name: Deploy

# Runs after CI succeeds on main so only green builds reach Pages, and
# publishes the very commit that CI checked.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, never cancelling one in progress. By default a
# newly queued run replaces the one waiting, so a run with nothing to deploy
# could cancel the latest commit's deployment; with queue: max every run waits
# its turn instead. Turns can come out of order, which checking main's tip at
# the start of each turn makes harmless.
concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  # A commit is deployed only while it is still main's latest. CI for an older
  # one can pass after a newer commit has landed (a re-run by hand, say), and
  # publishing it could roll the site back; the newer commit is deployed once
  # its own CI passes instead. The check waits for the pages lock, so it
  # compares with main as it stands when this run's turn comes, not when CI
  # finished. Only pushes count: the branches filter matches a branch by name,
  # so CI on a pull request from a fork's own main matches too, and that CI
  # tested a merge commit, not the head_sha deployed below.
  latest:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    name: Check the commit is still main's latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.tip.outputs.latest }}
    steps:
      - name: Compare with main's tip
        id: tip
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$tip" = "$HEAD_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying $HEAD_SHA: main has moved on to $tip, which is deployed once its own CI passes."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

  deploy:
    needs: latest
    if: ${{ needs.latest.outputs.latest == 'true' }}
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A re-run of just this job, or of the failed jobs, reuses the latest
      # job's answer from an earlier attempt, which may be stale by now, so
      # every re-run asks again. It fails rather than skipping, so whoever
      # re-ran it can see that nothing was deployed.
      - name: Check again that the commit is still main's latest
        if: github.run_attempt != '1'
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "::error::Not deploying $HEAD_SHA on this re-run: main has moved on to $tip."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      # The commit CI passed, not the default GITHUB_SHA: under workflow_run
      # that is main's tip when this run was triggered, which can be newer and
      # unchecked.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build for Pages
        run: npm run build
        # Project Pages are served from /<repo>/, so the bundle must use that base.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
