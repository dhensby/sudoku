name: CI

on:
  push:
    branches: [main]
  # Every pull request, not just those into main: a PR stacked on another
  # (based on its branch) is reviewed long before it reaches main, and would
  # otherwise go unchecked until the one beneath it merges. The archive guard
  # compares with whatever branch the PR is based on. When the one beneath
  # merges, GitHub retargets it to main — an edit, which isn't among the
  # default triggers — so edits run too, but only one that changed the base
  # (see the job's condition), not a new title or description.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test & build
    if: github.event.action != 'edited' || github.event.changes.base != null
    # On the job, not the workflow: a run whose job is skipped (an edit to the
    # title) then never cancels the run in progress.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # The daily archive's guard holds a pull request's archive to the one
      # main has released (src/daily/archive.guard.test.ts), so it needs
      # main's copy; on main itself there is nothing to compare with.
      - name: Fetch the base branch, for the daily archive's guard
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Unit & component tests (with coverage)
        run: npm run coverage
        env:
          DAILY_ARCHIVE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  # Publishes main to GitHub Pages from the run that has just checked it, so
  # only a commit whose tests passed is deployed, and it is the one deployed. A
  # newer push to main cancels this run's tests if they are still going, so
  # its deployment never starts; once they have passed, it goes ahead and the
  # newer commit's follows.
  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main'
    # One deployment at a time; never cancel one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build for Pages
        run: npm run build
        # Project Pages are served from /<repo>/, so the bundle must use that base.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
