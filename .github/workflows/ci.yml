name: CI

on:
  push:
    branches: [main]
  # Every pull request, not just those into main: a PR stacked on another
  # (based on its branch) is reviewed long before it reaches main, and would
  # otherwise go unchecked until the one beneath it merges. The archive guard
  # compares with whatever branch the PR is based on. When the one beneath
  # merges, GitHub retargets it to main — an edit, which isn't among the
  # default triggers — so edits run too, but only one that changed the base
  # (see the job's condition), not a new title or description.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test & build
    if: github.event.action != 'edited' || github.event.changes.base != null
    # On the job, not the workflow: a run whose job is skipped (an edit to the
    # title) then never cancels the run in progress. A new run cancels the one
    # in progress for the same pull request, but on main each commit gets a
    # group of its own, so no run there cancels another. A re-run keeps the ref
    # and commit it first ran for, so in one group for all of main, re-running
    # an older commit's CI would cancel the latest commit's (two pushes close
    # together could race the same way), and as Deploy publishes only a commit
    # whose CI passed, and only while it is main's latest, the site would stay
    # behind until that CI is re-run or another commit lands. Just not
    # cancelling on main would not do: by default a run queued for a group
    # replaces the one already waiting there. The cost is that a commit
    # superseded on main is still checked to the end (Deploy skips it).
    concurrency:
      group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # The daily archive's guard holds a pull request's archive to the one
      # main has released (src/daily/archive.guard.test.ts), so it needs
      # main's copy; on main itself there is nothing to compare with.
      - name: Fetch the base branch, for the daily archive's guard
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Unit & component tests (with coverage)
        run: npm run coverage
        env:
          DAILY_ARCHIVE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
